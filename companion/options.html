<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tessera Companion</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 14px/1.45 system-ui, sans-serif;
      margin: 0;
      padding: 18px 20px 20px;
      min-width: 360px;
      max-width: 460px;
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .lede { margin: 0 0 16px; opacity: 0.7; }
    .module {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 14px;
      padding: 12px 0;
      border-top: 1px solid color-mix(in srgb, currentColor 14%, transparent);
    }
    .module strong { font-weight: 600; }
    .module p { margin: 0; grid-column: 1; opacity: 0.7; font-size: 13px; }
    .module .status { font-size: 12px; margin-top: 4px; }
    .status.on { color: #2e9e4f; }
    .status.off { opacity: 0.6; }
    input[type="checkbox"] { grid-row: 1 / span 3; align-self: start; width: 18px; height: 18px; margin: 2px 0 0; }
    footer { margin-top: 16px; font-size: 12px; opacity: 0.7; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>Tessera Companion</h1>
  <p class="lede">Modules connect this browser to the Tessera GNOME Shell extension on this computer. Nothing leaves the machine.</p>
  <div id="modules"></div>
  <footer>Tessera must be installed with its browser integration turned on in Preferences → Launcher.
    <a href="https://github.com/Sbh321/tessera/blob/main/docs/BROWSER_TABS.md" target="_blank" rel="noopener">Setup guide</a></footer>
  <script type="module" src="options.js"></script>
</body>
</html>
